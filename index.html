<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toppatoo — Sama Wergu Yaram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --p:#087f78;
  --pd:#05645f;
  --pl:#e8f7f5;
  --bg:#f7fbfa;
  --text:#173b3a;
  --muted:#6c817f;
  --border:#e2eeec;
  --danger:#c0392b;
  --warning:#b7791f;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.nav{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  text-decoration:none;
  height:52px;
}

.logo-img{
  display:block;
  width:auto;
  height:46px;
  max-width:180px;
  object-fit:contain;
}

.navlinks{
  display:flex;
  gap:22px;
}

.navlinks a{
  text-decoration:none;
  color:#496361;
  font-weight:600;
  font-size:14px;
}

.actions{
  display:flex;
  gap:8px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
}

.primary{
  background:var(--p);
  color:#fff;
}

.primary:hover{
  background:var(--pd);
}

.secondary{
  background:#fff;
  color:var(--p);
  border:1px solid #c8dfdc;
}

.danger{
  background:#fff0ee;
  color:var(--danger);
  border:1px solid #f1c4bd;
}

.hero{
  padding:75px 0;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:55px;
  align-items:center;
}

.badge{
  display:inline-block;
  background:var(--pl);
  color:var(--p);
  padding:8px 13px;
  border-radius:30px;
  font-weight:700;
  font-size:13px;
  margin-bottom:18px;
}

h1{
  font-size:clamp(44px,6vw,68px);
  line-height:1.03;
  margin-bottom:20px;
}

h1 span{
  color:var(--p);
}

.hero p{
  color:var(--muted);
  font-size:18px;
  margin-bottom:25px;
}

.hero-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:24px;
  padding:25px;
  box-shadow:0 18px 50px rgba(8,127,120,.08);
}

.preview-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.preview{
  border:1px solid var(--border);
  border-radius:15px;
  padding:17px;
}

.preview b{
  display:block;
}

.preview small{
  color:var(--muted);
}

.section{
  padding:70px 0;
}

.heading{
  text-align:center;
  max-width:680px;
  margin:0 auto 35px;
}

.heading h2{
  font-size:36px;
}

.heading p{
  color:var(--muted);
  margin-top:8px;
}

.features,
.audience{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.feature{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
}

.feature-icon{
  font-size:25px;
  margin-bottom:10px;
}

.feature p,
.audience p{
  color:var(--muted);
  font-size:14px;
}

.audience{
  grid-template-columns:1fr 1fr;
}

.audience-card{
  padding:30px;
  border-radius:24px;
  background:#fff;
  border:1px solid var(--border);
}

.audience-card.prof{
  background:var(--p);
  color:#fff;
}

.audience-card.prof p{
  color:rgba(255,255,255,.8);
}

.dashboard{
  display:none;
  padding:45px 0 75px;
}

.dashboard.show{
  display:block;
}

.dash-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.dash-head p{
  color:var(--muted);
}

.dash-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.dash-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  cursor:pointer;
  transition:.2s;
}

.dash-card:hover{
  box-shadow:0 15px 35px rgba(8,127,120,.08);
  transform:translateY(-2px);
}

.dash-card .ico{
  font-size:28px;
  margin-bottom:8px;
}

.dash-card p{
  color:var(--muted);
  font-size:13px;
}

.list{
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  padding:23px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.row{
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  margin:10px 0;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
  transition:.2s;
}

.row:hover{
  border-color:#b7d9d5;
  box-shadow:0 5px 18px rgba(8,127,120,.06);
}

.row-main{
  flex:1;
}

.row small{
  display:block;
  color:var(--muted);
}

.row-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  background:var(--pl);
  color:var(--p);
  font-size:11px;
  font-weight:700;
  margin-top:5px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(23,59,58,.45);
  z-index:50;
  padding:18px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalbox{
  background:#fff;
  width:min(760px,100%);
  max-height:94vh;
  overflow:auto;
  border-radius:23px;
  padding:27px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  border:0;
  background:none;
  font-size:26px;
  color:var(--muted);
}

.form-group{
  margin:0 0 13px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:5px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
}

.form-group textarea{
  min-height:75px;
  resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:var(--p);
}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.form-actions .btn{
  flex:1;
}

.info{
  background:var(--pl);
  color:var(--p);
  padding:12px;
  border-radius:11px;
  font-size:13px;
  font-weight:700;
  margin-bottom:13px;
}

.patient-summary{
  background:#f5faf9;
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  margin-bottom:18px;
}

.patient-summary h3{
  margin-bottom:8px;
}

.patient-summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  font-size:13px;
}

.patient-summary-item span{
  color:var(--muted);
}

.patient-summary-item strong{
  display:block;
}

.pediatric{
  background:#fff8e8;
  border:1px solid #f0dfb3;
  padding:15px;
  border-radius:14px;
  margin-bottom:14px;
}

.pediatric h3{
  font-size:16px;
  margin-bottom:10px;
}

.section-title{
  font-size:17px;
  margin:20px 0 12px;
  padding-bottom:7px;
  border-bottom:1px solid var(--border);
}

.search-box{
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:12px;
}

.history-card{
  background:#f8fbfa;
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
  margin:12px 0;
}

.history-card h4{
  margin-bottom:7px;
}

.history-meta{
  color:var(--muted);
  font-size:13px;
  margin:3px 0;
}

.prescription-item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  margin:10px 0;
  background:#fafdfc;
}

.hidden{
  display:none!important;
}

footer{
  padding:35px 0;
  border-top:1px solid var(--border);
  background:#fff;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:900px){
  .navlinks{
    display:none;
  }

  .hero-grid{
    grid-template-columns:1fr;
  }

  .features{
    grid-template-columns:1fr 1fr;
  }

  .dash-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:600px){
  .nav{
    min-height:62px;
  }

  .logo-img{
    height:40px;
    max-width:150px;
  }

  .actions .secondary{
    display:none;
  }

  .hero{
    padding:48px 0;
  }

  .hero-actions{
    flex-direction:column;
  }

  .hero-actions .btn{
    width:100%;
  }

  .features,
  .audience,
  .dash-grid,
  .preview-grid,
  .patient-summary-grid{
    grid-template-columns:1fr;
  }

  .section{
    padding:50px 0;
  }

  .heading h2{
    font-size:29px;
  }

  .dash-head{
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }

  .row{
    flex-direction:column;
    align-items:flex-start;
  }

  .row-actions{
    width:100%;
  }

  .row-actions .btn{
    flex:1;
  }

  .form-actions{
    flex-direction:column;
  }
}
</style>
</head>
