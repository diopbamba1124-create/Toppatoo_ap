<script>
async function createAccount(){

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    if(!name || !phone || !email || !password){

        alert("Veuillez remplir tous les champs.");

        return;
    }

    if(password.length < 6){

        alert("Le mot de passe doit contenir au moins 6 caractères.");

        return;
    }

    try {

        const response = await fetch(
            "https://dgehholykcfyfwgpbbto.supabase.co/auth/v1/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",

                    "apikey":
                    "sb_publishable_f1ucxryKg1O2JjwIovX69g_oip3hsip"
                },

                body: JSON.stringify({

                    email: email,

                    password: password,

                    data: {
                        full_name: name,
                        phone: phone,
                        role: role
                    }

                })
            }
        );

        const data = await response.json();

        if(!response.ok){

            console.error(data);

            alert(
                "Impossible de créer le compte.\n\n" +
                (data.msg ||
                 data.message ||
                 data.error_description ||
                 "Une erreur est survenue.")
            );

            return;
        }

        alert(
            "✅ Compte Toppatoo créé avec succès !\n\n" +
            "Bienvenue " + name + ".\n\n" +
            "Votre compte est maintenant enregistré dans Supabase."
        );

        closeModal();

    } catch(error){

        console.error(error);

        alert(
            "❌ Erreur de connexion à Supabase.\n\n" +
            "Vérifiez votre connexion Internet et réessayez."
        );
    }
}
</script>
