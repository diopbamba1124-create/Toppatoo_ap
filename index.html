<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Toppatoo — Sama Wergu Yaram">
<title>Toppatoo — Sama Wergu Yaram</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --primary:#087f78;
    --primary-dark:#05645f;
    --primary-light:#e8f7f5;
    --text:#173b3a;
    --muted:#6c817f;
    --background:#f7fbfa;
    --white:#fff;
    --border:#e2eeec;
    --shadow:0 18px 50px rgba(8,127,120,.10);
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--background);
    color:var(--text);
    line-height:1.6;
}

button{
    font-family:inherit;
    cursor:pointer;
}

.container{
    width:min(1120px,92%);
    margin:auto;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
}

.navbar{
    min-height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    text-decoration:none;
    min-width:150px;
}

.logo-image{
    height:52px;
    width:auto;
    max-width:210px;
    object-fit:contain;
}

.logo-fallback{
    display:none;
    color:var(--primary);
    font-size:24px;
    font-weight:900;
}

.nav-links{
    display:flex;
    gap:24px;
}

.nav-links a{
    text-decoration:none;
    color:#496361;
    font-size:14px;
    font-weight:600;
}

.nav-links a:hover{
    color:var(--primary);
}

.nav-buttons{
    display:flex;
    gap:10px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:12px 18px;
    font-weight:700;
    font-size:14px;
    transition:.2s ease;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-secondary{
    background:white;
    color:var(--primary);
    border:1px solid #c8dfdc;
}

.btn-light{
    background:white;
    color:var(--primary);
}

.hero{
    padding:75px 0;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:55px;
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--primary-light);
    color:var(--primary);
    padding:8px 14px;
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    margin-bottom:22px;
}

.hero h1{
    font-size:clamp(44px,6vw,70px);
    line-height:1.03;
    letter-spacing:-2.5px;
    margin-bottom:23px;
}

.hero h1 span{
    color:var(--primary);
}

.hero-description{
    color:var(--muted);
    font-size:18px;
    max-width:600px;
    margin-bottom:30px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
}

.hero-actions .btn{
    padding:14px 20px;
}

.health-card{
    background:white;
    border:1px solid var(--border);
    border-radius:30px;
    padding:24px;
    box-shadow:var(--shadow);
}

.health-card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.health-card-title{
    font-weight:800;
}

.active{
    background:#e7f8ef;
    color:#278154;
    padding:7px 11px;
    border-radius:30px;
    font-size:12px;
    font-weight:700;
}

.profile{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--primary-light);
    padding:18px;
    border-radius:20px;
    margin-bottom:15px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:17px;
    display:grid;
    place-items:center;
    background:white;
    font-size:24px;
}

.profile strong{
    display:block;
}

.profile small{
    color:var(--muted);
}

.health-items{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.health-item{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:17px;
}

.health-icon{
    font-size:22px;
    margin-bottom:8px;
}

.health-item strong{
    display:block;
    font-size:15px;
}

.health-item small{
    color:var(--muted);
}

.section{
    padding:80px 0;
}

.section-heading{
    text-align:center;
    max-width:700px;
    margin:0 auto 45px;
}

.section-heading .tag{
    color:var(--primary);
    font-weight:800;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.section-heading h2{
    font-size:38px;
    line-height:1.15;
    margin:10px 0 14px;
}

.section-heading p{
    color:var(--muted);
}

.features{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:17px;
}

.feature{
    background:white;
    border:1px solid var(--border);
    border-radius:23px;
    padding:25px;
}

.feature-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    display:grid;
    place-items:center;
    background:var(--primary-light);
    font-size:24px;
    margin-bottom:19px;
}

.feature h3{
    margin-bottom:8px;
}

.feature p{
    color:var(--muted);
    font-size:14px;
}

.audience{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.audience-card{
    border-radius:28px;
    padding:35px;
    background:white;
    border:1px solid var(--border);
}

.audience-card.professional{
    background:var(--primary);
    color:white;
}

.audience-icon{
    font-size:35px;
    margin-bottom:18px;
}

.audience-card h3{
    font-size:25px;
    margin-bottom:10px;
}

.audience-card p{
    margin-bottom:22px;
    color:var(--muted);
}

.professional p{
    color:rgba(255,255,255,.78);
}

.ai-section{
    background:#eef8f6;
}

.ai-card{
    display:grid;
    grid-template-columns:.8fr 1.2fr;
    align-items:center;
    gap:45px;
    background:white;
    border:1px solid var(--border);
    border-radius:30px;
    padding:42px;
    box-shadow:var(--shadow);
}

.ai-symbol{
    min-height:230px;
    border-radius:25px;
    background:var(--primary-light);
    display:grid;
    place-items:center;
    font-size:80px;
}

.ai-card h2{
    font-size:35px;
    margin-bottom:12px;
}

.ai-card p{
    color:var(--muted);
    margin-bottom:20px;
}

.cta{
    padding:75px 0;
}

.cta-box{
    background:var(--primary);
    color:white;
    border-radius:30px;
    padding:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:30px;
}

.cta-box h2{
    font-size:34px;
    line-height:1.2;
}

.cta-box p{
    margin-top:8px;
    opacity:.82;
}

footer{
    background:white;
    border-top:1px solid var(--border);
    padding:40px 0;
}

.footer-content{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.footer-brand{
    color:var(--primary);
    font-weight:800;
}

.footer-text{
    color:var(--muted);
    font-size:13px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(23,59,58,.45);
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:92vh;
    overflow-y:auto;
    background:white;
    border-radius:25px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.18);
    position:relative;
}

.modal-close{
    position:absolute;
    top:15px;
    right:18px;
    border:0;
    background:transparent;
    font-size:25px;
    color:var(--muted);
}

.modal-box h2{
    margin-bottom:8px;
}

.modal-box>p{
    color:var(--muted);
    margin-bottom:20px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px;
    border:1px solid var(--border);
    border-radius:12px;
    font-size:15px;
    outline:none;
    font-family:inherit;
    background:white;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--primary);
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.modal-actions .btn{
    flex:1;
}

.dashboard{
    display:none;
    padding:45px 0 80px;
}

.dashboard.show{
    display:block;
}

.dashboard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:25px;
}

.dashboard-header h2{
    font-size:32px;
}

.dashboard-header p{
    color:var(--muted);
}

.dashboard-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
    margin-bottom:25px;
}

.dashboard-card{
    background:white;
    border:1px solid var(--border);
    border-radius:22px;
    padding:23px;
    cursor:pointer;
    transition:.2s;
}

.dashboard-card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow);
}

.dashboard-card .big{
    font-size:30px;
    margin-bottom:10px;
}

.dashboard-card h3{
    margin-bottom:5px;
}

.dashboard-card p{
    color:var(--muted);
    font-size:13px;
}

.list-box
